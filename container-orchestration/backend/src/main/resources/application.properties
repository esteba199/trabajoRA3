# ==============================================================================
# Spring Boot Production Properties Configuration
# Reads all sensitive and environment-specific settings from OS environment variables
# ==============================================================================

# Server Configuration
server.port=${BACKEND_PORT:8080}
server.servlet.context-path=/api

# Database Connection Settings (mapped to MySQL Docker service name 'mysql-db')
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-db:3306/daw_orchestration_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:daw_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:daw_secure_db_password_101}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Health & Metrics Monitoring Configuration (useful for orchestration)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
