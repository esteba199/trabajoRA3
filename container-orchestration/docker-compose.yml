version: '3.8'

services:
  # 1. Reverse Proxy Service (Nginx) - Single Entry Point
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: daw-nginx:1.25.4-alpine
    container_name: daw-nginx-proxy
    ports:
      - "${NGINX_PORT}:80"
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - frontend_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Frontend Service (React - Multi-stage)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: daw-frontend-react:1.0.0
    container_name: daw-frontend-app
    restart: unless-stopped
    networks:
      - frontend_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. Backend Service (Spring Boot - Multi-stage)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: daw-backend-springboot:1.0.0
    container_name: daw-backend-api
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. Database Service (MySQL)
  mysql-db:
    image: mysql:8.0.36
    container_name: daw-mysql-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
    driver: local

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
